# Registro de riscos: classifica quanto risco existe numa mudança antes de agir.
# Schema: harness/schemas/risk-register.schema.json
# controls[] são referências TIPADAS — nem todo controle é arquivo local.
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

risks:
  - id: RISK-WEBQA-001
    area: webqa
    description: >
      Rajada de carga ou sondagem ativa disparada contra o cockpit sem autorização humana — o
      cockpit fala com o daemon Docker de um servidor real, então o efeito não fica no navegador.
    likelihood: low
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: harness/policies/execution-modes.md
      - kind: local_path
        ref: .github/workflows/qa.yml
      - kind: local_path
        ref: src/cockpit_harness/plano.py
      - kind: standard_symbol
        standard: webqa-suite
        version_source: requirements-qa.txt
        ref: "webqa/gates.py::require_discovery"
      - kind: github_environment
        ref: production
      - kind: local_path
        ref: architecture/adr/ADR-001-webqa-como-padrao-externo.md

  - id: RISK-DEP-001
    area: dependencies
    description: "Atualização automática altera a régua de auditoria sem revisão."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: technical_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: requirements-qa.txt
      - kind: local_path
        ref: harness/policies/dependency-updates.md
      - kind: branch_protection
        ref: "main:require_pull_request_reviews"
      - kind: local_path
        ref: architecture/adr/ADR-003-versao-em-fonte-unica.md

  - id: RISK-META-001
    area: governance
    description: "Metadado declarado sem fiscal deriva do repositório real e mente em silêncio."
    likelihood: medium
    impact: medium
    treatment: mitigate
    owner: technical_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: ci/validate_metadata.py
      - kind: local_path
        ref: .github/workflows/validate-metadata.yml
      - kind: local_path
        ref: tests/integration/test_fiscal.py
      - kind: local_path
        ref: architecture/adr/ADR-002-enforcement-nao-em-markdown.md

  - id: RISK-CHANGE-001
    area: governance
    description: "Agente aplica mudança de alto risco sem declaração de impacto nem aval humano."
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: harness/schemas/change-proposal.schema.json
      - kind: local_path
        ref: ci/validate_metadata.py
      - kind: local_path
        ref: harness/policies/change-proposals.md
      - kind: local_path
        ref: architecture/adr/ADR-004-mudanca-proposta-declarada.md

  - id: RISK-ALVO-001
    area: availability
    description: >
      Auditoria apontada para produção (docker.danzeroum.com) por falta de URL de homologação
      declarada — o repositório de origem só publica o host de produção.
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: open
    controls:
      - kind: local_path
        ref: tests/qa/config.yaml
      - kind: local_path
        ref: src/cockpit_harness/contrato.py
      - kind: local_path
        ref: tests/e2e/test_checklist_adocao.py
      - kind: local_path
        ref: architecture/adr/ADR-006-pendencia-em-vez-de-alvo-inventado.md

  - id: RISK-HOMOLOG-001
    area: access
    description: >
      Ambiente de homologação com superfície de escrita ligada vira uma segunda porta para o
      daemon Docker do servidor de produção — normalmente com credencial mais fraca, porque
      "é só homologação". O stack divide host, disco e rede com o cockpit de verdade.
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: deploy/homologacao/compose.yml
      - kind: local_path
        ref: tests/integration/test_homologacao.py
      - kind: local_path
        ref: deploy/homologacao/setup-ingress-homolog.sh
      - kind: local_path
        ref: architecture/adr/ADR-007-stack-de-homologacao-no-consumidor.md

  - id: RISK-SEGREDO-001
    area: access
    description: >
      Escopo autorizado real (host, dono, prova de posse) comitado num repositório público,
      publicando o que deveria ser segredo injetado no CI.
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: mitigated
    controls:
      - kind: local_path
        ref: .gitignore
      - kind: local_path
        ref: tests/qa/escopo-autorizado.yaml.example
      - kind: local_path
        ref: tests/e2e/test_checklist_adocao.py
      - kind: local_path
        ref: architecture/adr/ADR-006-pendencia-em-vez-de-alvo-inventado.md
