      Auditoria apontada para produção (docker.danzeroum.com) por falta de URL de homologação
      declarada — o repositório de origem só publica o host de produção.
    likelihood: medium
    impact: high
    treatment: prevent
    owner: security_owner
    status: open
    # 03/11/2026, a mesma data dos gêmeos do molde (RISK-EXT-001, RISK-CHANGE-002,
    # RISK-INCUBA-001). Convergir os calendários é deliberado: risco com data própria é
    # risco revisado sozinho, e revisado sozinho é esquecido.
    due: "2026-11-03"
    controls:
      - kind: local_path
        ref: tests/qa/config.yaml
      # `src/cockpit_harness/contrato.py` e `tests/e2e/test_checklist_adocao.py` eram os controles
