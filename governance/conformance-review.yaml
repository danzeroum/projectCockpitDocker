    - id: CONF-015
      severity: medium
      summary: >
        CUSTO DO MASCARAMENTO POR LINHA — medido, e o resultado inverte a pergunta. A hipótese em
        aberto era "mask por linha tem preço de CPU e risco de quebrar o consumo do stream". O
        preço de CPU é DESPREZÍVEL e não é o obstáculo; o obstáculo é que a máquina não existe.
        CPU (Xeon 2.80GHz, 4 vCPU, Python 3.11, corpus sintético determinístico): ~400 ns/linha,
        ~170 MB/s, estável nas três densidades (0%/1%/10%) e nos três volumes (1k/100k/1M). A
        janela de 500 linhas custa 0,2 ms. O atraso acrescentado à PRIMEIRA linha do stream — o
        custo que o operador às 3h sente — é de 372 ns. Nada disso decide coisa alguma.
        COBERTURA, que é o que decide: `mask_inspect` é ESTRUTURALMENTE inaplicável a texto livre —
        recebe `dict` e procura `Config.Env/Cmd/Labels`. `mask_value` exige uma CHAVE, que uma
        linha de log não tem. Sobra `_mask_uri_credential`, e ele pega 2 de 7 segredos realistas
        (29%) e ZERO de 5 amostras de dado pessoal (0%) — que é exatamente o material do RISCO-001.
        FALSO POSITIVO da máquina atual sobre URL legítima: 1 em 5 (20%), e o caso é eloquente —
        ela mascara `https://github.com/danzeroum/docker@1da4d51` para `https://********@1da4d51`,
        destruindo o SHA que este repositório inteiro usa como âncora.
