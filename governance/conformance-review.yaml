        o .gitignore pelo do molde e perdeu `deploy/homologacao/.env` e
        `tests/qa/escopo-autorizado.yaml`. Entre aquele commit e este, um `git add -A` teria
        comitado credencial de homologação ou o escopo autorizado real. Restauradas nesta fatia,
        porque consertar regressão própria não é "consertar falha legada em silêncio" — é a suíte
        legada tendo feito o trabalho dela.
        AS TRÊS QUE SOBRAM, classificadas: (3) test_metadados_coerentes_com_o_repositorio exige
        `validate_metadata` sair 0 — EXPECTATIVA OBSOLETA, porque o modelo de incubação diz que o
        derivado nasce vermelho e a catraca é quem guarda o encolhimento; (4)
        test_harness_yaml_valida_contra_o_proprio_schema aponta `external_audit`, `stages_manifest`
        e `env_denylist_exact` ausentes — DEFEITO REAL de carcaça não terminada, já contado em
        `meta:estrutural`; (5) test_fiscal_de_metadados_roda_no_ci exige a string
        `ci/validate_metadata.py` no workflow, que roda `ci/validate_all.py` — EXPECTATIVA
        OBSOLETA, e é literalmente o mesmo erro que eu cometi em ADR-002-A1: âncora contra a
