        sobre ruído de log: 1 em 6 (17%) — `checksum 192.168.001-24` vira `********` por parecer
        CPF.
        BORDA DO STREAM, e ela é decisiva: um segredo partido entre dois frames VAZA. O demux
        entrega texto que pode cortar no meio de um token, e a máscara por linha não tem como ver
        o que ficou no frame anterior.
        CONCLUSÃO: a alavanca custa uma IMPLEMENTAÇÃO NOVA, não uma aplicação — um detector de PII
        em texto livre, com buffer de fronteira de frame, que hoje não existe em lugar nenhum do
