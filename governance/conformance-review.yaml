    - id: CONF-008
      severity: medium
      summary: >
        O VOCABULÁRIO DA CARCAÇA v1.0.0 SUPÕE QUE O CONSUMIDOR CONTÉM O PRÓPRIO CÓDIGO, e a
        fatia-4 da CP-003 foi o primeiro caso a desmentir isso — extraiu `src/cockpit_harness/`
        para um repositório próprio e passou a consumi-lo por pin exato. Duas travas perderam a
        capacidade de dizer o que é verdade, ambas medidas ao tentar executá-las.
        (1) `ci/validate_metadata.py::_declaradas` lê `pyproject.toml` com o regex
        `"nome[<>=!~]..."` e não reconhece referência direta PEP 508 (`nome @ git+url`) — de modo
        que a forma mais perigosa que existe, código arbitrário de um host qualquer, é justamente
        a que o inventário de supply chain não enxerga. Consequência: `cockpit-harness` está
        inventariada em `security/dependencies.yaml`, é declarada de fato em `pyproject.toml`, e
        o fiscal a acusa de "entrada morta". 1 achado, na categoria nova `meta:dependência`.
        (2) `harness/schemas/risk-register.schema.json` fixa `kind` em local_path,
        standard_symbol (com `standard` const "webqa-suite"), github_environment e
        branch_protection. Não há como declarar "o controle vive na dependência que eu pino":
        três controles de RISK-WEBQA-001, RISK-ALVO-001 e RISK-SEGREDO-001 emigraram e só puderam
        ser registrados em comentário.
        O CAMPO QUE FALTA, nomeado: um `kind: pinned_dependency` com `ref` (símbolo ou arquivo) e
        `version_source` apontando para onde o pin mora — o mesmo desenho de `standard_symbol`,
        que já resolve exatamente este problema para a régua externa e foi escrito como se a régua
        fosse a única dependência com essa propriedade.
      disposition: change_proposal
      ref: harness/change-proposals/CP-003-virar-derivado-do-molde.yaml
      consumed_by:
        kind: change_proposal
        ref: CP-003

    - id: CONF-009
      severity: medium
