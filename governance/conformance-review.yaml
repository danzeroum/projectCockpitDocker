        pinar: com `src/` local, exit 30; com o pin `@9522f0d`, exit 30, mesma mensagem. O pin não
        causa nem corrige — a divergência é anterior a ele e veio do transplante da carcaça
        (CP-002).
        Não é consertada aqui porque a correção é uma decisão sobre QUAL schema é o certo: o da
        carcaça, e então a harness muda o envelope; ou o pré-transplante, e então o molde precisa
        aceitar `findings`/`result`. Essa escolha vale para todo derivado, não só para este.
      disposition: change_proposal
      ref: harness/change-proposals/CP-003-virar-derivado-do-molde.yaml
      consumed_by:
        kind: change_proposal
        ref: CP-003

