        container do host. Fechá-lo é reduzir o que se expõe — janela, autorização, retenção — NO
        ALVO, que este repositório lê e não escreve (`harness.yaml:target_feedback` nasce false).
        Declará-lo resolvido sem reduzir nada seria a fraude exata que este sistema existe para
        tornar cara.
      disposition: accepted
      rationale: >
