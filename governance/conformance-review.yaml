        declarar o que ele deve FAZER; isso deixou de ser verdade.
        O MARCO DE `exit 0` NÃO FOI ALCANÇADO, e são dois bloqueios de naturezas diferentes.
        (1) Os 11 achados de `validate_metadata` (10 `teste órfão` + 1 `meta:dependência`) são
        CONF-007 e CONF-008, e a CP-039 do molde JÁ OS CORRIGIU — mas o conserto não chegou aqui:
        `target.lock:mold_release` ancora a release v1.0.0 (commit 9b8071c), e a CP-039 vive na
        `main` do molde sem release que a carregue. Consumir exige release nova do molde MAIS
        atualização de carcaça, que é a operação de risco alto da CP-002: trocar quem mede é
        diferente de mudar o que é medido.
        (2) O achado de LGPD é de outra natureza e NÃO se fecha com metadado nenhum.
        `ci/audit_lgpd.py:490` reprova qualquer issue P0/P1 com `status: open`, e RISCO-001 é P1
