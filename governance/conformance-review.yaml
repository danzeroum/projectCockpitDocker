    - id: CONF-006
      severity: low
      summary: >
        CORRIGIDO POR MEDIÇÃO — o achado anterior estava errado, e o erro era meu. Eu havia
        registrado `notificacoes.js` e `notifications.js` como "candidato a código morto",
        inferindo de nomes confundíveis. Medido: NÃO são duplicatas, são módulos com
        responsabilidades distintas. `notifications.js` (304 linhas) é a camada de toast e modal —
        `showToast`, `showAckModal`, `showUnlockModal` —, referenciada por seis arquivos incluindo
        `main.js` e quatro telas. `notificacoes.js` (87 linhas) é o SELO "notificado hh:mm · canal"
        ao lado do achado (B7), referenciado por uma tela e importando o outro. Nenhum é morto.
        O que sobra é risco de LEITURA, e ele é real: `screens/attention.js` importa os dois em
        linhas adjacentes, e quem ler depressa vai achar que uma das duas é sobra. É achado de
        nomenclatura para o canal de retorno do alvo, não de remoção — e a evidência é a contagem
        de referências acima, não a semelhança dos nomes.
      disposition: accepted
      rationale: >
        Registrar a correção em vez de reescrever o achado é deliberado: o erro de método importa
        mais que o resultado. Eu inferi de nome num repositório cuja disciplina inteira é medir
        antes de afirmar — e é a mesma classe da quarta reincidência, âncora na menção em vez de
        no fato. A decisão do dono do produto sobre renomear um dos dois é obra no alvo.

    - id: CONF-007
      severity: medium
      summary: >
        A ISENÇÃO DE APOIO DE TESTE NÃO É EXPRESSÁVEL na carcaça v1.0.0, e isto foi medido ao
        tentar executá-la. `architecture/components.yaml:exemptions` cobre "arquivos sob
        code_roots"; `check_orphan_code` é o único fiscal que a lê. Os dez arquivos de apoio
        (conftest, requirements-test, dois stubs de DOM, três .conf de nginx, um snapshot e dois
        shims de deploy) vivem sob TEST_ROOTS, e `check_orphan_tests` não consulta `exemptions`.
        Declará-los produziu exatamente dez achados de "isenção morta" — a própria trava do molde
        recusando a declaração — e zero redução nos dez `teste órfão`. Líquido: +10.
        Não existe, na carcaça, instrumento para "arquivo de apoio de teste, declarado, que não é
        teste". Os dez ficam contados como dívida VISÍVEL, que é o segundo melhor estado.
      disposition: change_proposal
      ref: harness/change-proposals/CP-003-virar-derivado-do-molde.yaml
      consumed_by:
        kind: change_proposal
