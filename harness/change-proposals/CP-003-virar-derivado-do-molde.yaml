# Declarar `kind: derived` e ancorar o alvo — a virada de SIGNIFICADO dos metadados.
# Depende da CP-002 (a carcaça precisa estar atualizada), mas a CP-002 não depende desta.
#
# O que muda, e está em cinco linhas de ci/inventory_code.py:
#
#     def _roots(project_doc):
#         target = (project_doc or {}).get("target")
#         if not target:
#             return "", RAIZES_MOLDE["code"], RAIZES_MOLDE["test"]
#         return (WORKSPACE + "/", target["code_roots"], target["test_roots"])
#
# Sem `target`, o fiscal inventaria o código DESTE repositório. Com `target`, ele muda de raiz:
# passa a inventariar o alvo materializado em workspace/target/ no SHA de target.lock, e
# src/cockpit_harness/ deixa de ser varrido. Não vira órfão — vira INVISÍVEL.
#
# É por isso que esta proposta é separada da CP-002 e não um passo dela. Não é uma migração
# técnica: é decidir o que os metadados deste repositório descrevem. Hoje descrevem a CLI que
# fiscaliza a adoção (4 capacidades, 4 componentes, 12 regras, todas com evidência em testes
# nossos). Depois passariam a descrever o Docker Cockpit — outro objeto, com outras capacidades.
#
# Schema: harness/schemas/change-proposal.schema.json · Fiscal: ci/validate_metadata.py
