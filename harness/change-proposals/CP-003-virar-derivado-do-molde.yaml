# padrão, porque ele se repetiu três vezes nesta migração — fixture que herda estado, workspace
# ausente, laudo antigo. Um fiscal que não alcança o que deveria medir reporta VERDE, e verde por
# não ter olhado é indistinguível de verde por estar certo.
#
# O VERMELHO É O MAPA, E AGORA TEM CATRACA. O molde já diz que derivado em incubação nasce
# vermelho e que `/ingerir` é o caminho até o verde. O que ele não dá é a garantia de que o mapa
# ENCOLHE — e dentro de um CI já vermelho, um achado novo não é notado por ninguém. `ci/catraca.py`
# fecha isso: o baseline por categoria fica versionado em `harness/state/baseline-achados.json`, e
# o workflow recusa SUBIDA e CATEGORIA NOVA.
#
# Duas propriedades dela, escolhidas e não herdadas:
#
#   - compara por IGUALDADE, não por teto. Teto deixaria o baseline alto para sempre: o primeiro
#     PR desce 40, ninguém regrava, e o seguinte sobe 40 de volta sem a catraca girar. Exigir
#     igualdade força quem desce a regravar, e o diff do baseline é o registro de que girou.
#   - o baseline do PR é conferido contra o da BASE. Sem isso bastaria subir o contador e regravar
#     no mesmo commit: o arquivo passaria a descrever fielmente um repositório pior.
#
# Ela NÃO exige descida por PR. Exigir pedágio faria alguém apagar uma declaração para pagá-lo,
# que é o oposto do que se quer.
