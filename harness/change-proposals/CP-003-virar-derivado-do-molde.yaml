    rationale: >
      Alto porque reancora o repositório inteiro: todo `source_path`, `test_path`, `verified_by`
      e `validated_by` passa a resolver contra outro código. Uma reancoragem malfeita não falha
      alto — ela produz um conjunto de metadados internamente coerente que descreve um sistema
      diferente do que se pensa estar descrevendo.

      O ganho é real e não é burocrático. Destrava `/sincronizar` (drift entre o metadado e o
      alvo vira trabalho declarado em vez de suposição), `/ingerir` com procedência ancorada, e
      os departamentos que o molde ganhou nas fases D-G: conformidade contínua, segurança como
      departamento, e LGPD em dois níveis — que aqui não é hipótese, porque o cockpit expõe
      logs de container e log é onde dado pessoal aparece por acidente (é o que
      project.yaml:classification já diz, em prosa que nenhum fiscal lê).

      A perda também é real, e é a razão de esta decisão ser humana. O `src/cockpit_harness/`
      sai do campo de visão do fiscal: a harness pararia de governar a própria CLI que fiscaliza
      a adoção. Hoje ela é governada — 4 componentes, 12 regras, evidência em 16 arquivos de
      teste. Depois seria território não declarado num repositório cujo produto é justamente
      não ter território não declarado.

      Há uma saída para isso, e ela precisa ser decidida ANTES de executar, não depois: ou o
      `cockpit_harness` vira isenção declarada com justificativa em components.yaml:exemptions
      (honesto, e assume a perda), ou este repositório se divide em dois — o gêmeo de governança
      do cockpit, e a ferramenta que ele usa. A segunda é mais fiel ao modelo do molde e custa
      um repositório a mais. Nenhuma das duas é obviamente certa, e é isso que a proposta
      submete a aval em vez de resolver sozinha.

      Pré-requisitos que não são nossos: o alvo precisa de `ref` e `code_roots` DESCOBERTOS no
      reconhecimento (a política proíbe presumir que a branch é `main` ou que o código mora em
      `src/`), e raiz declarada que não existe no alvo é achado — um `code_roots` chutado torna
      a invariante do código órfão verdadeira por vacuidade, que é a pior falha possível aqui
      porque é indistinguível de cobertura real.
