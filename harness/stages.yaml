# As etapas do projeto e seus fiscais.
#
# Este arquivo é um ÍNDICE, não uma segunda descrição do projeto. Ele referencia artefatos por
# CAMINHO e fiscais por caminho/símbolo — nunca restata um ID (CAP-, REQ-, CMP-, RULE-, UI-,
# MET-, ADR-, RISK-), e o schema recusa estruturalmente quem tentar. IDs moram no arquivo dono.
#
# O que torna a cobertura verificável em vez de aspiracional são três checagens em
# ci/audit_governance.py: todo artefato casa arquivo real; todo fiscal resolve (com ::simbolo,
# o AST confirma que a função existe); e todo arquivo do repositório pertence a exatamente uma
# etapa ou a uma isenção declarada. Diretório novo passa a exigir declaração de etapa.
#
# Schema: harness/schemas/stages.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

stages:
  - id: STAGE-VISION
    order: 1
    name: "Visão e métricas de sucesso"
    artifacts: ["business/vision.yaml"]
    enforced_by:
      - kind: schema
        ref: harness/schemas/vision.schema.json
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: metric_ids
    privacy_lens:
      scan: true
      question: "A proposta de valor exige tratar dado pessoal? Com qual finalidade declarada?"

  - id: STAGE-CAPABILITIES
    order: 2
    name: "Capacidades de negócio"
    artifacts: ["business/capabilities.yaml"]
    enforced_by:
      - kind: schema
        ref: harness/schemas/capabilities.schema.json
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_capabilities
    privacy_lens:
      scan: true
      question: "Alguma capacidade depende de dado pessoal para existir? Ela é minimizável?"

  - id: STAGE-RULES
    order: 3
    name: "Regras de negócio"
    artifacts: ["business/rules"]
    enforced_by:
      - kind: schema
        ref: harness/schemas/business-rules.schema.json
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_business_rules
    privacy_lens:
      scan: true
      question: "Alguma regra decide sobre pessoa? Decisão automatizada exige revisão (Art. 20)."

  - id: STAGE-BACKLOG
    order: 4
    name: "Requisitos e backlog"
    artifacts: ["business/requirements"]
    enforced_by:
      - kind: schema
        ref: harness/schemas/backlog.schema.json
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_backlog
    privacy_lens:
      scan: true
      question: "O requisito coleta dado novo? Coletar menos resolveria o mesmo problema?"

  - id: STAGE-ARCHITECTURE
    order: 5
    name: "Componentes e interfaces"
    artifacts: ["architecture/components.yaml", "architecture/interfaces.yaml"]
    enforced_by:
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_components
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_interfaces
    privacy_lens:
      scan: true
      question: "Qual componente é dono de qual dado pessoal? A interface expõe além da finalidade?"

  - id: STAGE-DECISIONS
    order: 6
    name: "Decisões de arquitetura (ADRs)"
    artifacts: ["architecture/adr"]
    enforced_by:
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_adr_index
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_adr_conformance
    privacy_lens:
      scan: true
      question: "A decisão muda o fluxo de dado pessoal? Se muda, o julgamento de impacto venceu."

  - id: STAGE-DESIGN
    order: 7
    name: "Design system e superfícies de UI"
    artifacts: ["design"]
    enforced_by:
      - kind: schema
        ref: harness/schemas/ui-surfaces.schema.json
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_ui_surfaces
    privacy_lens:
      scan: true
      question: "A superfície pede dado além do necessário? Há toggle pré-marcado (privacy by default)?"

  - id: STAGE-CODE
    order: 8
    name: "Código de negócio"
    # No molde, "src". No derivado, o código do alvo materializado em workspace/target/ — que
    # harness_lib exclui da varredura dos fiscais pelo mesmo motivo da evidência: é material
    # efêmero de terceiro, e exigir que cada arquivo do alvo pertença a uma etapa DESTE
    # repositório faria a partição do derivado depender do tamanho do projeto que ele governa.
    #
    # CP-003 fatia-4: "src" saiu. Este repositório não tem mais código próprio — a harness de
    # adoção virou danzeroum/cockpit-harness, consumida por pin exato em pyproject.toml. O que
    # resta aqui é declaração e fiscal, e o código de negócio passou a ser inteiramente o do alvo.
    artifacts: ["workspace"]
    enforced_by:
      - kind: workflow_step
        ref: .github/workflows/qa.yml
        step: "Inventário (Trabalho B — sem rede, sem autorização)"
      - kind: external_standard
        ref: "webqa inventario"
        standard: webqa-suite
        version_source: requirements-qa.txt
    privacy_lens:
      scan: true
      question: "Existe campo com forma de dado pessoal fora do inventário? Log grava PII?"

  - id: STAGE-TESTS
    order: 9
    name: "Testes"
    # CP-003 fatia-4: "tests/unit" e "tests/e2e" saíram junto com o código que exercitavam — foram
    # para danzeroum/cockpit-harness, onde a unidade sob teste mora. Sobra o que testa ESTE
    # repositório: integração (o que os metadados afirmam sobre o alvo e sobre a bancada) e
    # governança (as mordidas dos fiscais).
    artifacts: ["tests/integration", "tests/governance", "tests/conftest.py"]
    enforced_by:
      - kind: workflow_step
        ref: .github/workflows/qa.yml
        step: "Inventário (Trabalho B — sem rede, sem autorização)"
      - kind: workflow_step
        ref: .github/workflows/governance.yml
        step: "Testes dos fiscais"
    privacy_lens:
      scan: true
      question: "Há dado pessoal real em fixture? Massa de teste é dado de produção disfarçado."

  - id: STAGE-QA-CONFIG
    order: 10
    name: "Configuração declarativa de QA"
    artifacts: ["tests/qa", "requirements-qa.txt"]
    enforced_by:
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_version_single_source
      - kind: workflow_step
        ref: .github/workflows/qa.yml
        step: "Auditoria passiva (Trabalho A — só com alvo e escopo autorizados)"
    privacy_lens:
      scan: true
      question: "O escopo autorizado e a evidência retida contêm dado pessoal do alvo?"

  - id: STAGE-GOVERNANCE
    order: 11
    name: "Governança: identidade, riscos, propostas e privacidade"
    artifacts:
      - "project.yaml"
      - "target.lock"
      - "harness/pipeline"
      - "governance"
      - "harness/harness.yaml"
      - "harness/stages.yaml"
      - "harness/policies"
      - "harness/change-proposals"
      - "harness/agents"
      - "harness/prompts"
      - "harness/runs"
      - "harness/reports"
      - "harness/state"
      - "harness/releases"
    enforced_by:
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_agent_prompt_pairing
      - kind: ci_script
        ref: ci/audit_ledger.py
        symbol: check_append_only
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_external_attestation
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_cp_lifecycle
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_decision_chain
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_mold_release
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_release_manifests
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_risk_controls
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_risk_control_coverage
      - kind: ci_script
        ref: ci/audit_lgpd.py
        symbol: check_judgment_currency
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_target_lock
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_derived_from
      - kind: ci_script
        ref: ci/audit_governance.py
        symbol: check_ingest_pipeline
      - kind: ci_script
        ref: ci/alignment_report.py
        symbol: r1_capacidade_de_alto_risco_sem_risco
      - kind: ci_script
        ref: ci/audit_conformance.py
        symbol: check_review_currency
    privacy_lens:
      scan: true
      question: "O papel do sistema (controlador/operador) declarado bate com o que ele de fato trata?"

  - id: STAGE-SECURITY
    order: 12
    name: "Segurança: ameaças e dependências"
    artifacts: ["security"]
    enforced_by:
      - kind: schema
        ref: harness/schemas/threat-model.schema.json
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_threat_model
      - kind: ci_script
        ref: ci/validate_metadata.py
        symbol: check_dependency_inventory
      - kind: ci_script
        ref: ci/check_dependency_conflict.py
        symbol: conflitos
    privacy_lens:
      scan: true
      question: "Alguma ameaça expõe dado pessoal? A mitigação declarada cobre o vazamento, ou só o acesso?"

  - id: STAGE-CI-HARNESS
    order: 13
    name: "Fiscais, schemas e entrega"
    artifacts:
      - "ci"
      - ".github"
      - ".claude"
      - "CLAUDE.md"
      - "harness/schemas"
      - "pyproject.toml"
      # CP-028 — o lockfile do ambiente dos fiscais e o script que dá paridade local a ele.
      - "requirements-ci.txt"
      - "harness/local_validate.sh"
    enforced_by:
      - kind: ci_script
        ref: ci/validate_all.py
        symbol: main
      - kind: ci_script
        ref: ci/audit_mutations.py
        symbol: provar
      - kind: workflow_step
        ref: .github/workflows/governance.yml
        step: "Validação total do projeto"
      - kind: ci_script
        ref: ci/audit_lgpd.py
        symbol: check_evidence_retention
    privacy_lens:
      scan: false
      question: "Segredo ou dado pessoal em log de CI, artifact ou variável de ambiente?"

  - id: STAGE-DOCS
    order: 14
    name: "Documentação"
    artifacts: ["docs", "README.md", "BOOTSTRAP.md", "WEBQA_CONSUMER_CONTRACT.md"]
    enforced_by:
      - kind: ci_script
        ref: ci/generate_graph.py
        symbol: main
      - kind: ci_script
        ref: ci/generate_schema_docs.py
        symbol: render
    privacy_lens:
      scan: false
      question: "A documentação expõe dado real em exemplo? Exemplo com CPF válido é vazamento."

  # A BANCADA DE HOMOLOGAÇÃO — etapa nova na fatia-4 da CP-003, e a alternativa que ela recusa
  # explica o desenho. `deploy/` estava fora de qualquer etapa: três achados de partição, e a saída
  # barata seria declará-lo isento. Isenção custaria a EVIDÊNCIA — um stack que abre uma porta para
  # o daemon Docker do servidor real não é "arquivo que não governa o produto"; é o artefato de
  # maior consequência deste repositório. Isento, ele deixaria de ter fiscal declarado.
  #
  # AS QUATRO INVARIANTES desta etapa são as RULE-HOMOLOG-001..004 aposentadas no mesmo PR. Elas
  # nunca descreveram o cockpit: descreviam o plano de controle antigo, cujo código saiu daqui.
  # Aposentar não é apagar — o enunciado e a razão de cada uma migraram para ADR-018, e a MORDIDA
  # de cada uma está abaixo, no fiscal que a sucede, uma linha por invariante.
  #
  # Por que o texto foi para o ADR e não para cá: o schema desta etapa é `additionalProperties:
  # false` e não tem campo de prosa — `name` é uma linha e `privacy_lens.question` é outra
  # pergunta. Registrado como lacuna do molde no corpo do PR, irmã da CONF-007, e não contornada
  # com campo inventado local.
  - id: STAGE-DEPLOY
    order: 15
    name: "Bancada de homologação (o ambiente que a régua tem permissão de medir)"
    artifacts: ["deploy"]
    enforced_by:
      # RULE-HOMOLOG-001 → "não age sobre a INFRAESTRUTURA". Duas trancas em camadas diferentes:
      # a de dentro é da aplicação (ENABLE_ACTIONS="0"), a de fora é do daemon (o proxy nega
      # POST/DELETE). O símbolo abaixo é o da tranca de fora, que é a que sobrevive a um erro de
      # configuração da aplicação.
      - kind: ci_script
        ref: tests/integration/test_homologacao.py
        symbol: test_socket_proxy_nega_escrita_no_daemon
      # RULE-HOMOLOG-002 → "não colide com produção". `compose up` com o nome de container de
      # produção derruba o cockpit de verdade; `down -v` com o volume compartilhado apaga a série
      # histórica.
      - kind: ci_script
        ref: tests/integration/test_homologacao.py
        symbol: test_container_nao_colide_com_producao
      # RULE-HOMOLOG-003 → "não reusa a credencial de produção". Credencial igual faz o ambiente
      # de teste virar porta alternativa para o mesmo servidor.
      - kind: ci_script
        ref: tests/integration/test_homologacao.py
        symbol: test_script_recusa_credencial_identica_a_de_producao
      # RULE-HOMOLOG-004 → "produção nunca é publicada pelo caminho de homologação". Rodar o
      # script com o host de produção publicaria o stack de teste com TLS válido: o pior tipo de
      # erro, porque parece que funcionou.
      - kind: ci_script
        ref: tests/integration/test_homologacao.py
        symbol: test_script_de_ingress_recusa_o_host_de_producao
      # E a prova de que os quatro RODAM. Símbolo existente que ninguém executa é fiscal de
      # papel: `pytest -q` cobre tests/integration, e este passo é onde ele acontece.
      - kind: workflow_step
        ref: .github/workflows/qa.yml
        step: "Inventário (Trabalho B — sem rede, sem autorização)"
    privacy_lens:
      scan: true
      question: "O .env de exemplo ou o script de ingress carregam credencial, host ou dado real de produção em vez de placeholder?"

# Isenções DECLARADAS. Uma isenção que não casa nenhum arquivo é isenção morta e vira achado:
# serve só para fazer a partição parecer fechada.
ungoverned:
  - path: LICENSE
    justification: "Texto legal imutável de terceiro; não descreve nem governa o produto, e alterá-lo não muda comportamento algum do sistema."
  - path: .gitignore
    justification: "Configuração de ferramenta; a evidência que ele exclui do versionamento já é declarada e fiscalizada em harness/harness.yaml:paths."
