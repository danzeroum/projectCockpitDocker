name: qa

# Onde a trava morde. A harness é declarativa; a enforcement efetiva vive aqui e nos gates
# fail-closed da suíte externa.
#
#  - inventory + passive: automáticos (push/PR), runner-kind ci, ambiente limpo.
#  - load / active_discovery: SÓ workflow_dispatch, disparados por pessoa, jobs segregados.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo segregado a rodar (humano dispara)"
        required: true
        type: choice
        options:
          - load
          - active_discovery
      confirm:
        description: 'Digite "confirmo" para autorizar o modo segregado'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Guardas estruturais + inventário + auditoria passiva. Rodam sempre.
  # ---------------------------------------------------------------------------
  inventory-and-passive:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Ambiente automático não define nenhum WEBQA_*: os gates não moram no ambiente do CI automático.
    # (O contexto `env` não pode ser referenciado em job-level env; a higiene é provada no passo negativo abaixo.)
    steps:
      - uses: actions/checkout@v4

      # Guarda de fronteira: a régua nunca mora neste repo (política webqa.md).
      - name: Recusar régua copiada (declarar, não copiar)
        run: |
          set -euo pipefail
          violacao=0
          for alvo in webqa checks data/caminhos-sensiveis.yaml; do
            if [ -e "$alvo" ]; then
              echo "::error::'$alvo' não pode existir no consumidor — a régua é declarada, não copiada."
              violacao=1
            fi
          done
          if [ "$violacao" -ne 0 ]; then exit 40; fi

      # Guarda de pin exato: webqa-suite deve estar pinado com == (política dependency-updates.md).
      - name: Exigir pin exato do padrão
        run: |
          set -euo pipefail
          if ! grep -Eq '^webqa-suite==[^[:space:]]+' requirements-qa.txt; then
            echo "::error::requirements-qa.txt deve pinar webqa-suite com == (sem faixa)."
            exit 40
          fi

      # A trava que morde: prova que o denylist DETECTA uma variável WEBQA_* injetada.
      # O passo passa quando a detecção funciona (comportamento correto do guard) e só falha
      # se o denylist NÃO detectar — aí sim o CI acusa que a trava parou de morder.
      - name: Higiene de ambiente — denylist WEBQA_* deve detectar (passo negativo)
        env:
          WEBQA_LEAK: "1"
        run: |
          set -euo pipefail
          if env | grep -qE '^WEBQA_'; then
            echo "::notice::Guard detectou variável WEBQA_* — fail_on_denied_env=true abortaria (DENIED_ENV=10)."
            echo "Detecção OK: o denylist morde."
          else
            echo "::error::Denylist não detectou WEBQA_LEAK — a trava parou de morder."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A harness NÃO é mais deste repositório (CP-003 fatia-4): `pip install -e .` resolve o pin
      # exato por SHA declarado em pyproject.toml, apontando para danzeroum/cockpit-harness.
      - name: Instalar a harness da adoção + ferramentas
        run: pip install -e ".[dev]"

      # Trabalho B — INVENTÁRIO. Sem rede, sem autorização: roda os testes de integração do próprio
      # repositório. Unidade e aceitação saíram na fatia-4 junto com o código que exercitavam, e
      # rodam no CI do repositório extraído. É o passo mais barato e o mais seguro, por isso vem
      # primeiro (invariante 3: inventário antes de auditoria) — e é ele que executa os quatro
      # fiscais declarados por STAGE-DEPLOY.
      - name: Inventário (Trabalho B — sem rede, sem autorização)
        run: pytest -q

      # `--raiz .` em TODA chamada, e não é estilo. Instalada, a harness resolve sua raiz padrão
      # por `Path(__file__).parents[2]` — que em src-layout era o repositório e em site-packages é
      # `lib/`. Medido antes de ajustar: sem a flag, as nove chamadas saem
      # `CONFIG_INVALID: requirements-qa.txt ausente`. O consumidor passou a declarar a própria
      # raiz, que é o que ele sabe e a dependência não.
      - name: Verificação do contrato de consumo
        run: python -m cockpit_harness --raiz . checar

      # Consumo do padrão externo. A versão sai da FONTE ÚNICA (requirements-qa.txt), lida pela
      # harness — o YAML nunca restata o número. A v1.0.0 não está no PyPI e não expõe CLI
      # instalável, então a régua é OBTIDA por clone na tag exata e executada por marcador de
      # pytest (docs/ADOCAO.md §4 e §8). O `pip install` segue como tentativa tolerante: quando a
      # suíte publicar, ele passa a resolver sozinho e o clone vira redundância.
      - name: Obter o padrão declarado (pin exato; tolerante)
        id: regua
        run: |
          set -uo pipefail
          VERSAO="$(python -m cockpit_harness --raiz . versao)"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          pip install -r requirements-qa.txt || echo "::notice::webqa-suite ainda não resolve por PyPI — usando o clone na tag."
          if git clone --depth 1 --branch "v$VERSAO" https://github.com/danzeroum/qa-suite "$RUNNER_TEMP/qa-suite"; then
            pip install -r "$RUNNER_TEMP/qa-suite/webqa-suite/requirements.txt" || true
            echo "regua_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::tag v$VERSAO não existe em danzeroum/qa-suite — auditoria em modo stub (suite_not_installed, código 20). O repositório da régua não publica tags; ver docs/ADOCAO.md §4 e REQ-008. NÃO faça fallback para main: uma régua sem pin mede o alvo com uma fita que muda sozinha."
            echo "regua_ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Trabalho A — PASSIVO. Só roda com alvo de homologação E escopo autorizado. Enquanto
      # houver INCOMPLETE:target_url, o passo REGISTRA a pendência e não emite requisição alguma:
      # pular dizendo por quê é honesto; medir um alvo inventado não é.
      #
      # O NAVEGADOR é instalado AQUI, e não num passo próprio, porque a instalação só faz sentido
      # depois das guardas: na condição normal deste repositório (INCOMPLETE:target_url) não há o
      # que medir, e baixar Chromium a cada push seria minuto de CI por nada.
      #
      # Por que ele passou a ser necessário. A expressão anterior terminava em `not browser`, e
      # medindo a régua na bancada descobriu-se o que isso custava:
      #
      #     família     com browser   sem browser
      #     backend         19            19
      #     frontend        19            13
      #     ux              16            12
      #     seguranca       16             0   <— a família INTEIRA
      #     lgpd            18             9
      #
      # Os 16 checks de `seguranca` são todos `browser` (por desenho: a família mede o que o
      # NAVEGADOR baixa). A expressão nomeava cinco famílias e entregava quatro — e a que sumia
      # inteira era segurança. Nomear e descartar em silêncio é pior que não nomear.
      - name: Auditoria passiva (Trabalho A — só com alvo e escopo autorizados)
        run: |
          set -uo pipefail
          if ! python -m cockpit_harness --raiz . pendencias --exigir; then
            echo "::warning::Auditoria passiva pulada — pendências acima (SCOPE_MISSING, código 12). Ver docs/ADOCAO.md §5."
            exit 0
          fi
          if [ "${{ steps.regua.outputs.regua_ok }}" != "true" ]; then
            echo "::warning::Régua indisponível — nada a medir (suite_not_installed, código 20)."
            exit 0
          fi
          WEBQA_TARGET_URL="$(python -m cockpit_harness --raiz . alvo)"
          export WEBQA_TARGET_URL
          cd "$RUNNER_TEMP/qa-suite/webqa-suite"

          # A expressão nunca NOMEIA uma família que este run não pode medir. Sem navegador,
          # `seguranca` sai da lista e o aviso a nomeia — em vez de continuar escrita numa
          # expressão que a descarta em silêncio, que era exatamente o defeito.
          PROMETIDAS="backend frontend ux seguranca lgpd"
          if python -m playwright install --with-deps chromium; then
            FILTRO="and not load"
          else
            echo "::warning::Chromium não instalou — a família 'seguranca' (16 checks, TODOS browser) sai deste run, e frontend/ux/lgpd rodam parciais. Quatro famílias medidas, não cinco."
            FILTRO="and not load and not browser"
            PROMETIDAS="backend frontend ux lgpd"
          fi

          # Guarda contra o defeito voltar por outro caminho: toda família PROMETIDA tem de
          # coletar pelo menos um teste. Foi um `and not browser` que zerou `seguranca` sem
          # que nada acusasse; um filtro novo pode zerar outra família do mesmo jeito.
          # A checagem é pela AUSÊNCIA de "no tests collected", e não por um padrão de
          # contagem: o pytest imprime "16/1029 tests collected", "1 test collected"
          # (singular, sem barra) e "no tests collected" — casar a contagem erraria o
          # caso de um teste só, acusando família vazia onde há uma.
          vazias=""
          for familia in $PROMETIDAS; do
            if pytest -m "$familia $FILTRO" --collect-only -q 2>/dev/null \
                 | grep -q 'no tests collected'; then
              vazias="$vazias $familia"
            fi
          done
          if [ -n "$vazias" ]; then
            echo "::error::famílias prometidas que não coletam teste nenhum:$vazias — a auditoria promete o que não mede."
            exit 21
          fi

          EXPRESSAO="$(echo "$PROMETIDAS" | sed 's/ / or /g')"
          pytest -m "($EXPRESSAO) $FILTRO"

      # O laudo carimba a régua OBSERVADA (commit + hash da lista curada). Sem observação, sai
      # 'UNINSTALLED' — nunca um carimbo inventado.
      - name: Laudo com procedência (evidência do run)
        if: always()
        run: |
          set -uo pipefail
          python -m cockpit_harness --raiz . laudo --modo inventory --runner ci \
            --regua "$RUNNER_TEMP/qa-suite" \
            --saida "harness/reports/laudo-${GITHUB_RUN_ID}.json"

      - name: Arquivar evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: harness/reports/
          if-no-files-found: ignore
          # Declarado, e não deixado no default: sem esta linha a retenção efetiva da evidência
          # vem de uma setting do GitHub — fora do repositório e fora do alcance de qualquer
          # fiscal. 90 é project.yaml:governance.evidence_retention_days, e é o fiscal de LGPD
          # que cobra a igualdade entre os dois números.
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Modos segregados. SÓ workflow_dispatch, disparados por pessoa. Agente/CI automático
  # nunca chega aqui. environment: production exige revisores (configurar no repositório).
  # ---------------------------------------------------------------------------
  segregated-load-or-active:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # aprovação manual obrigatória — configurar required reviewers
    steps:
      - name: Validar confirmação humana
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "confirmo" ]; then
            echo "::error::Confirmação ausente. Modo segregado exige disparo humano explícito."
            exit 11
          fi
          echo "Modo segregado autorizado por pessoa: ${{ github.event.inputs.mode }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar a harness da adoção
        run: pip install -e ".[dev]"

      # Mesma obtenção do job automático: versão da fonte única, régua clonada na tag exata.
      - name: Obter padrão declarado (pin exato)
        run: |
          set -uo pipefail
          VERSAO="$(python -m cockpit_harness --raiz . versao)"
          pip install -r requirements-qa.txt || true
          git clone --depth 1 --branch "v$VERSAO" https://github.com/danzeroum/qa-suite "$RUNNER_TEMP/qa-suite" \
            && pip install -r "$RUNNER_TEMP/qa-suite/webqa-suite/requirements.txt" || \
            echo "::warning::régua v$VERSAO indisponível (suite_not_installed, código 20)."

      # O escopo REAL nunca está no repositório: ele é montado aqui, a partir do segredo, e some
      # com o runner. Sem o segredo, o passo seguinte não tem escopo e a suíte recusa (12).
      - name: Montar escopo autorizado a partir do segredo
        env:
          ESCOPO_AUTORIZADO: ${{ secrets.WEBQA_ESCOPO_AUTORIZADO }}
        run: |
          set -uo pipefail
          if [ -n "${ESCOPO_AUTORIZADO}" ]; then
            printf '%s' "${ESCOPO_AUTORIZADO}" > tests/qa/escopo-autorizado.yaml
            echo "escopo montado a partir do segredo (não versionado)"
          else
            echo "::warning::Segredo WEBQA_ESCOPO_AUTORIZADO ausente — modo segregado sem escopo (SCOPE_MISSING, 12)."
          fi

      # Aqui — e SÓ aqui — o ambiente monta o gate correspondente, no job segregado.
      #
      # O que este passo fazia e por que estava errado. `active_discovery` rodava
      # `pytest -m "seguranca and not load"` e NUNCA invocava a sondagem. Duas consequências,
      # ambas medidas na bancada:
      #
      #  1. `webqa/sondagem.py` é o ÚNICO consumidor de WEBQA_DISCOVERY_AUTHORIZED — nenhum
      #     arquivo em checks/ lê esse gate. Toda a cerimônia (disparo humano, `confirmo`,
      #     environment: production com revisores, escopo do segredo) protegia um run que não
      #     emitia probe nenhum. O modo tinha o nome da coisa e não fazia a coisa.
      #  2. O comentário anterior dizia "a v1.0.0 não tem CLI". Tem: `python -m webqa.sondagem`,
      #     rodado no commit pinado. A premissa era falsa, e por isso ninguém procurou o erro.
      #
      # E o `cp` do escopo entregava um arquivo que a régua não lê: os dois se chamam
      # `escopo-autorizado.yaml` e têm schemas incompatíveis (nosso: `authorized/scope.hosts`;
      # dela: `alvos:` por origem). `webqa.escopo.carregar` recusaria com "escopo sem alvos
      # declarados". A tradução agora é explícita, testada, e some com o runner.
      - name: Rodar modo segregado
        env:
          WEBQA_LOAD_AUTHORIZED: ${{ github.event.inputs.mode == 'load' && '1' || '' }}
          WEBQA_DISCOVERY_AUTHORIZED: ${{ github.event.inputs.mode == 'active_discovery' && '1' || '' }}
        run: |
          set -uo pipefail
          if [ ! -d "$RUNNER_TEMP/qa-suite/webqa-suite" ]; then
            echo "::warning::régua ausente — nada a rodar (suite_not_installed, código 20)."
            exit 0
          fi
          WEBQA_TARGET_URL="$(python -m cockpit_harness --raiz . alvo)" || {
            echo "::error::sem alvo declarado — modo segregado recusado (SCOPE_MISSING, 12)."
            exit 12
          }
          export WEBQA_TARGET_URL
          RAIZ="$PWD"
          mkdir -p "$RAIZ/harness/reports"

          case "${{ github.event.inputs.mode }}" in
            load)
              cd "$RUNNER_TEMP/qa-suite/webqa-suite"
              pytest -m load
              ;;
            active_discovery)
              # Fail-closed antes de qualquer requisição: sem tradução não há escopo, e sem
              # escopo a sondagem não tem para onde apontar. Recusar aqui é mais barato — e
              # mais honesto — do que descobrir na régua com o probe já no ar.
              ESCOPO="$RUNNER_TEMP/escopo-da-regua.yaml"
              python -m cockpit_harness --raiz . escopo-regua --saida "$ESCOPO" || exit 12

              cd "$RUNNER_TEMP/qa-suite/webqa-suite"
              LAUDO="$RAIZ/harness/reports/sondagem-${GITHUB_RUN_ID}.json"
              # C1: HEAD-only, sem seguir redirect, sem ler corpo. `--executar` porque o padrão
              # da régua é dry-run; os portões dela decidem se algo sai.
              python -m webqa.sondagem \
                --escopo "$ESCOPO" \
                --alvo "$(python -c 'import os,urllib.parse as u; p=u.urlsplit(os.environ["WEBQA_TARGET_URL"]); print(f"{p.scheme}://{p.netloc}")')" \
                --executar \
                --saida "$LAUDO" \
                --sarif "$RAIZ/harness/reports/sondagem-${GITHUB_RUN_ID}.sarif"

              # O veredito é NOSSO. A régua sai 0 mesmo com o laudo dizendo `inconclusivo: true`
              # (medido: alvo fora do ar ⇒ "0/8 caminhos, 0 achado(s)", exit 0). 22 = não medido,
              # 23 = medido e reprovou. Sem este passo, um alvo inalcançável passaria como limpo.
              cd "$RAIZ"
              python -m cockpit_harness --raiz . veredito --laudo "$LAUDO"
              ;;
          esac

      # Evidência do modo segregado — é o run que mais precisa dela e o único que não a arquivava.
      - name: Arquivar evidência da sondagem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase-c-reports
          path: harness/reports/
          if-no-files-found: ignore
          # Declarado, e não deixado no default: sem esta linha a retenção efetiva da evidência
          # vem de uma setting do GitHub — fora do repositório e fora do alcance de qualquer
          # fiscal. 90 é project.yaml:governance.evidence_retention_days, e é o fiscal de LGPD
          # que cobra a igualdade entre os dois números.
          retention-days: 90
