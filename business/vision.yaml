# Visão de produto: o problema, os usuários e as métricas de sucesso (IDs estáveis MET-*).
# Os requisitos do backlog citam quais métricas movem — o fiscal cobra que a métrica exista.
# Schema: harness/schemas/vision.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

product:
  problem: >
    O Docker Cockpit é medido hoje só pelos próprios testes: eles dizem se o código faz o que o
    autor quis, não se o que está publicado atende a uma régua de qualidade externa e estável.
    Sem régua versionada e sem procedência, dois relatórios de meses diferentes não são
    comparáveis — e ninguém percebe.
  target_users:
    - "quem opera o cockpit (responsável pela VPS e pelo ingress)"
    - "quem evolui o cockpit por agentes (precisa de contexto e de trava, não de conselho)"
    - "quem revisa o PR (precisa de evidência com procedência, não de captura de tela)"
  value_proposition: >
    Uma adoção verificável: a régua é declarada por versão exata, os modos de execução têm dono e
    gate, e todo laudo carimba qual régua o produziu — tornando "não comparável" um resultado
    possível em vez de um painel enganoso.
  success_metrics:
    - id: MET-FRONTEIRA
      description: "Caminhos da régua (webqa/, checks/, data/caminhos-sensiveis.yaml) presentes neste repositório."
      target: "= 0, verificado a cada push"
    - id: MET-PENDENCIA
      description: "Pendências INCOMPLETE:* abertas na configuração de consumo."
      target: "= 0 antes do primeiro laudo de modo passivo"
    - id: MET-COMPARAVEL
      description: "Laudos com fingerprint de régua idêntica entre dois runs da mesma versão."
      target: "100% — divergência é 'não comparável', nunca média silenciosa"

    # ── EMENDA (fatia-5 da CP-003, 2026-08-06): as quatro métricas do ALVO ───────────────────
    #
    # As três acima medem a ADOÇÃO — se a régua está sendo consumida direito. Continuam válidas.
    # O que faltava: nenhuma delas mede o COCKPIT. Ao autorar os requisitos reais do alvo, cada um
    # precisava citar a métrica que move, e não havia nenhuma que um requisito de operador movesse:
    # "o operador vê o certificado expirando antes de ele expirar" não move `MET-COMPARAVEL`.
    #
    # A emenda vai na VISÃO e não nos requisitos, e a direção é deliberada. Inventar a métrica que
    # o requisito já move é escrever o alvo no lugar da flecha; o caminho honesto é a visão admitir
    # que passou a governar outro sistema. As quatro saíram da leitura das 10 telas e das 22 rotas.
    - id: MET-ATENCAO
      description: >
        Problemas do host que chegam ao operador como ACHADO NOMEADO — com regra, severidade e o
        que fazer — em vez de como número num gráfico que alguém precisa interpretar. Medida pela
        cobertura do motor de regras sobre as classes de falha observáveis no daemon e no nginx.
      target: "toda classe de falha observável tem regra nomeada; 'o gráfico subiu' nunca é o achado"
    - id: MET-ACAO-AUDITADA
      description: >
        Mutações que atravessam a barreira declarada — destravamento com motivo, e linha de
        auditoria gravada inclusive nos caminhos de ERRO, não só no sucesso.
      target: "100%. Ação sem trilha é ação que ninguém consegue reconstruir depois"
    - id: MET-LEITURA-ESTAVEL
      description: >
        Leituras periódicas que NÃO reconstroem a árvore da tela. O cockpit relê a cada 30s, e uma
        releitura que redesenha tudo devolve o scroll ao topo e troca o botão sob o ponteiro entre
        o mousedown e o mouseup.
      target: "0 reconstruções por leitura sem mudança de dado (doc 13 do alvo)"
    - id: MET-SUPERFICIE
      description: >
        Superfície de escrita exposta quando `ENABLE_ACTIONS` está desligado — medida por rota
        REGISTRADA, não por botão escondido no DOM.
      target: "0 rotas de mutação registradas. 404, não 403: o que não existe não se tenta"
