  - id: REQ-009
    title: "Ver por onde a requisição entra e ONDE ELA PARA DE ANDAR"
    type: user-story
    capability: CAP-DIAGNOSTICAR
    status: done
    priority: high
    metrics:
      - MET-ATENCAO
    acceptance_criteria:
