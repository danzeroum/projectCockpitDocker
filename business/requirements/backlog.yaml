  - id: REQ-012
    title: "Destravar a sessão antes de qualquer mutação, dizendo o motivo"
    type: user-story
    capability: CAP-AGIR
    status: done
    priority: critical
    risk: RISK-SOCKET-001
    metrics:
      - MET-ACAO-AUDITADA
    governed_by:
      - RULE-AGIR-002
    acceptance_criteria:
      - "`POST /api/session/unlock` devolve token com prazo (`expires_at`), não sessão perpétua."
      - "O destravamento só é aceito se a origem estiver dentro de `TRUSTED_GATEWAY_CIDR`."
      - "CIDR NÃO CONFIGURADO BLOQUEIA — fail-closed. Variável ausente não é variável permissiva."
      - "Tentativa repetida é contada e bloqueada (`app/hardening.py:LIMITE`)."
    validated_by:
      - workspace/target/tests/test_unlock_v8.py
      - workspace/target/tests/test_session.py
      - workspace/target/tests/test_hardening_b11.py
