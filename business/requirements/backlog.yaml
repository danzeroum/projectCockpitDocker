  - id: REQ-019
    title: "Registrar e mover o trabalho que o achado gerou, num board de quatro colunas"
    type: user-story
    # CAP-AGIR e não CAP-NARRAR, e a correção veio da MEDIÇÃO: eu havia escrito NARRAR por o board
    # ser uma tela. Mas `POST /api/tasks` e `PATCH /api/tasks/{id}` são escrita atrás do
    # destravamento, e a fatia-2 já tinha atribuído `test_tasks*.py` a CMP-OPERACOES, que é de
    # CAP-AGIR. A propriedade do teste sabia antes de mim.
    capability: CAP-AGIR
    status: done
    priority: medium
    metrics:
      - MET-ACAO-AUDITADA
    acceptance_criteria:
      - "`GET /api/tasks` devolve o board agrupado; a LEITURA é livre, como toda leitura do cockpit."
      - "`POST /api/tasks` cria tarefa MANUAL — o board nunca cria 'auto' por HTTP; isso é do motor."
      - "`PATCH /api/tasks/{id}` move de coluna, atrás do destravamento."
    validated_by:
      - workspace/target/tests/test_tasks.py
      - workspace/target/tests/test_tasks_api.py
    # Os dois docstrings de `app/routers/tasks.py` marcam a fronteira: leitura livre, criação
    # manual apenas. "auto" nascer por HTTP deixaria o board contar história que ninguém viveu.

