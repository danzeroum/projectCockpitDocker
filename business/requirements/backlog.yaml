    title: "Coletar as métricas do cockpit pela mesma ferramenta que coleta o resto do parque"
    type: user-story
    # CAP-NARRAR, e a medição corrigiu meu palpite: eu havia escrito SUSTENTAR por `/metrics` ser
    # infraestrutura. Mas a fatia-2 atribuiu `test_metrics*.py` a CMP-SERIES, de CAP-NARRAR — e
    # está certa: expor a série para um coletor é entregar o estado, só que o destinatário é o
    # Prometheus em vez do operador.
    capability: CAP-NARRAR
    status: done
    priority: medium
    metrics:
      - MET-COMPARAVEL
    acceptance_criteria:
      - "`GET /metrics` expõe formato Prometheus, fora do prefixo `/api`."
      - "A exposição não depende de destravamento: é leitura, e o scraper não tem sessão."
    validated_by:
      - workspace/target/tests/test_metrics_prom.py
      - workspace/target/tests/test_metrics.py

  - id: REQ-026
    title: "Confiar no painel também em quem o abre: contraste, teclado e leitor de tela"
    type: user-story
    # CAP-NARRAR: o painel legível por quem o abre é entrega de estado ao operador, não política
    # de resposta do servidor. A UI-COCKPIT-PAINEL, que é de CAP-NARRAR, o satisfaz — e o fiscal
    # recusa superfície satisfazendo requisito de outra capacidade, com razão.
    capability: CAP-NARRAR
    status: done
    priority: high
    metrics:
