  - id: REQ-014
    title: "Silenciar um achado com motivo e prazo, sem que ele suma do registro"
    type: user-story
    # CAP-DIAGNOSTICAR, e o fiscal me obrigou a pensar: silenciar é o fim do CICLO DE VIDA do
    # achado, e a rota vive em `routers/findings.py`, que é CMP-ACHADOS. A barreira pela qual ela
    # passa é de CAP-AGIR (RULE-AGIR-002), mas passar por uma barreira não muda de que capacidade
    # o comportamento é — senão toda escrita do sistema seria CAP-AGIR e a distinção morreria.
    capability: CAP-DIAGNOSTICAR
    status: done
    priority: high
    metrics:
      - MET-ACAO-AUDITADA
    acceptance_criteria:
      - "`POST /api/findings/{id}/ack` exige destravamento e registra motivo e prazo (`sem prazo` é valor explícito)."
      - "Silenciar não apaga: o achado sai da fila e permanece consultável."
      - "Silenciar é da tela de Atenção, que audita — o Plantão não escreve."
    validated_by:
      - workspace/target/tests/test_findings.py

