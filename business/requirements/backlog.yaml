    # forma certa do fail-closed — a ausência da configuração fecha, nunca abre.

  - id: REQ-013
    title: "Reconstruir depois quem fez o quê, quando, de onde e por quê"
    type: user-story
    capability: CAP-AGIR
    status: done
    priority: critical
    metrics:
