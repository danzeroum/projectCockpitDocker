# Backlog de requisitos, cada item ligado a uma capacidade (CAP-*). Dá ao agente o QUE fazer e por
# quê, sem inventar escopo. Um item pode citar o risco que introduz e depender de outro.
# Schema: harness/schemas/backlog.schema.json
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# AUTORADOS NA FATIA-5 DA CP-003 (2026-08-06), e três coisas os definem:
#
# 1. SÃO DESCRITIVOS, não prescritivos. O cockpit existe e está publicado; estes requisitos dizem
#    o que ele JÁ FAZ, lido do sistema. `status: done` é o padrão, e `validated_by` só aparece
#    quando um teste do alvo prova o COMPORTAMENTO — não a existência do código.
#
# 2. DESCREVEM O QUE O OPERADOR FAZ, nunca o que o componente é. "Mostrar eventos" para
#    CMP-EVENTOS é contador zerado com aparência de requisito: parafrasear o nome do componente
#    fecha o fiscal de cobertura reversa sem acrescentar uma única informação sobre o produto.
#    O teste que apliquei em cada um: um operador do cockpit leria isto e diria "sim, é para isso
#    que eu uso"? Os que não passaram estão listados no fim deste arquivo, recusados por mim.
#
# 3. A FONTE, em ordem de autoridade: as 10 telas de `app/static/js/screens/` e as 22 rotas de
#    `app/routers/` — o que o usuário FAZ com o sistema —, depois o laudo antigo, depois o README
#    do alvo. Cada item cita a evidência; para o não-óbvio, arquivo e linha.
#
# Medição do alvo: danzeroum/docker @ d6ae70ea (target.lock), materializado em workspace/target/.
# ─────────────────────────────────────────────────────────────────────────────────────────────
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

items:
  # ══ CAP-OBSERVAR — ver o estado do daemon sem poder mudá-lo ═══════════════════════════════
  - id: REQ-001
    title: "Ver todo container do host, com estado e saúde, sem poder alterá-lo"
    type: user-story
    capability: CAP-OBSERVAR
    status: done
    priority: critical
    metrics:
      - MET-SUPERFICIE
    acceptance_criteria:
      - "A lista traz nome, imagem, estado e healthcheck de cada container do daemon."
      - "O detalhe de um container traz o inspect completo (`GET /api/containers/{id}/json`)."
      - "Com ENABLE_ACTIONS desligado, nenhuma rota de mutação está REGISTRADA — 404, não 403."
    validated_by:
      - workspace/target/tests/test_api.py
    # Evidência: `app/routers/containers.py` — 8 rotas GET antes de qualquer POST. A leitura é
    # incondicional; a escrita é que depende de gate. É a assimetria que define o produto.

  - id: REQ-002
    title: "Ler o log de um container — o histórico, o fluxo ao vivo e a busca por termo"
    type: user-story
    capability: CAP-OBSERVAR
    status: done
    priority: high
    metrics:
      - MET-ATENCAO
    acceptance_criteria:
      - "`GET /api/containers/{id}/logs` devolve a janela recente; `/logs/stream` acompanha ao vivo."
      - "`GET /api/containers/search` devolve TRECHOS com o termo destacado, do índice FTS5 — não o log inteiro para o navegador filtrar."
      - "A busca responde sobre o que já foi coletado, mesmo com o container parado."
    validated_by:
      - workspace/target/tests/test_logs_texto.py
    # A busca é FTS5 no servidor (`app/logs_ingest.py`), e o docstring da rota diz por quê:
    # "Trechos com o termo destacado, do indice FTS5". Um grep no cliente exigiria baixar tudo.

  - id: REQ-003
    title: "Ver o inventário do host: imagens, disco e versão do daemon, num lugar só"
    type: user-story
    capability: CAP-OBSERVAR
    status: done
    priority: medium
    metrics:
      - MET-ATENCAO
    acceptance_criteria:
      - "`GET /api/system/info` e `/api/system/images` trazem daemon e imagens; `/api/storage` o disco."
      - "`GET /api/overview` e `/api/stats/all` agregam o inventário numa leitura só, para a tela não fazer N chamadas."
    validated_by:
      - workspace/target/tests/test_api.py

  # ══ CAP-DIAGNOSTICAR — transformar o estado observado em achado acionável ═════════════════
  - id: REQ-004
    title: "Receber uma fila triada do que precisa de atenção agora, por severidade e por espera"
    type: user-story
    capability: CAP-DIAGNOSTICAR
    status: done
    priority: critical
    metrics:
      - MET-ATENCAO
    acceptance_criteria:
      - "`GET /api/findings?status=open` é a fonte única das duas telas que triam: Atenção e Plantão."
      - "No Plantão a ordem é severidade primeiro e, dentro da mesma severidade, o MAIS ANTIGO primeiro."
      - "Ordem cronológica invertida é recusada: faz o plantonista atender sempre o último grito."
    validated_by:
      - workspace/target/tests/test_findings.py
      - workspace/target/tests/test_telas_topologia_plantao.py
    # `app/static/js/screens/plantao.js:8-12` declara a ordenação como "a única decisão da tela",
    # e diz o que ela recusa: "quem esta aberto ha mais tempo ja esperou demais".

  - id: REQ-005
    title: "Ser avisado por regra NOMEADA, não por gráfico que alguém precisa interpretar"
    type: user-story
    capability: CAP-DIAGNOSTICAR
    status: done
    priority: critical
    metrics:
      - MET-ATENCAO
    governed_by:
      - RULE-DIAG-001
    acceptance_criteria:
      - "Cada achado nasce de uma regra com nome próprio, severidade e o que fazer — não de um limiar anônimo."
      - "As 17 regras cobrem as classes observáveis: container (restart_loop, oom, unhealthy, healthcheck_never_passed), TLS (ssl_protocols_weak, ssl_ciphers_weak, default_cert_borrowed, http_plain), exposição (docs_public, autoindex_enabled, server_tokens_exposed), entrega (no_gzip, no_http2, body_size_default, stream_timeout), rota (upstream_missing) e dado (no_backup)."
      - "Regra nova é ARQUIVO novo em `app/findings/rules/`, sem `if` no motor."
    validated_by:
      - workspace/target/tests/test_findings.py
      - workspace/target/tests/test_regras_container_parado.py
    # Contadas em `app/findings/rules/`: 17 módulos de regra mais o `__init__.py`. O ponto não é
    # o número, é a forma — cada uma diz O QUE está errado com nome de gente.

