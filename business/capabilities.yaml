# Capacidades de negócio com rastreabilidade física: cada capacidade aponta para código e teste
# reais. IDs estáveis (CAP-...) formam as arestas duráveis do grafo.
# Schema: harness/schemas/capabilities.schema.json
# O fiscal semântico só exige que source_paths/test_paths existam para status implemented/verified.
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

capabilities:
  - id: CAP-CONTRATO
    name: "Conformidade com o contrato de consumo"
    status: verified
    owners:
      business_owner: danzeroum
      technical_owner: danzeroum
    risk_level: high
    source_paths:
      - src/cockpit_harness/contrato.py
      - src/cockpit_harness/codigos.py
    test_paths:
      - tests/unit/test_contrato.py
      - tests/integration/test_repositorio.py
      - tests/e2e/test_checklist_adocao.py
    business_rules:
      - business/rules/contrato.yaml
    evidence:
      tests:
        - tests/unit/test_contrato.py
      architecture:
        - architecture/adr/ADR-003-versao-em-fonte-unica.md

  - id: CAP-MODOS
    name: "Roteamento de modo e higiene de ambiente"
    status: verified
    owners:
      business_owner: danzeroum
      technical_owner: danzeroum
    risk_level: critical
    source_paths:
      - src/cockpit_harness/plano.py
    test_paths:
      - tests/unit/test_plano.py
      - tests/integration/test_workflows.py
      - tests/e2e/test_cli_laudo.py
    business_rules:
      - business/rules/modos.yaml
    evidence:
      tests:
        - tests/unit/test_plano.py
      architecture:
        - architecture/adr/ADR-001-webqa-como-padrao-externo.md

  - id: CAP-PROCEDENCIA
    name: "Procedência e comparabilidade do laudo"
    status: verified
    owners:
      business_owner: danzeroum
      technical_owner: danzeroum
    risk_level: high
    source_paths:
      - src/cockpit_harness/procedencia.py
      - src/cockpit_harness/cli.py
      - src/cockpit_harness/__main__.py
    test_paths:
      - tests/unit/test_procedencia.py
      - tests/e2e/test_cli_laudo.py
    business_rules:
      - business/rules/procedencia.yaml
    evidence:
      tests:
        - tests/unit/test_procedencia.py
      quality_reports:
        - docs/laudo-adocao.json

  - id: CAP-ALVO
    name: "Auditoria do Docker Cockpit publicado"
    # planned, não verified: deste lado ela é auditoria A EXECUTAR, e segue bloqueada por
    # INCOMPLETE:target_url (ADR-006) até o ambiente subir. O CÓDIGO do alvo continua em
    # danzeroum/docker (ADR-007, que manteve essa parte da ADR-005), e a BANCADA
    # (deploy/homologacao/) não é source_path de capacidade.
    #
    # `source_paths` deixou de ser vazio quando a fase C ganhou peças NOSSAS: traduzir o
    # escopo entre os dois schemas de mesmo nome e emitir o veredito que a régua não emite.
    # Elas rodam de verdade (medidas na bancada), mas a CAPACIDADE segue `planned` porque o
    # que falta não é código — é alvo declarado. Promovê-la a `verified` por causa do código
    # seria dizer que se audita um host que ninguém declarou.
    status: planned
    owners:
      business_owner: danzeroum
      technical_owner: danzeroum
    risk_level: high
    source_paths:
      - src/cockpit_harness/escopo_regua.py
      - src/cockpit_harness/veredito.py
    test_paths:
      - tests/integration/test_homologacao.py
      - tests/integration/test_fase_c.py
      - tests/unit/test_escopo_regua.py
      - tests/unit/test_veredito.py
    business_rules:
      - business/rules/homologacao.yaml
