# APOSENTADAS NA FATIA-4 DA CP-003 — CAP-CONTRATO, CAP-MODOS, CAP-PROCEDENCIA e CAP-ALVO.
#
# As três primeiras têm DESTINO: descreviam `src/cockpit_harness/`, e o equivalente vive em
# danzeroum/cockpit-harness, onde o código passou a morar. Não são história apagada — são
# história que mudou de repositório junto com o que ela descrevia.
#
# CAP-ALVO ("Auditoria do Docker Cockpit publicado") é a única sem equivalente, e aposenta com
# MOTIVO em vez de destino: ela nunca descreveu o cockpit. Descrevia o plano de controle que
# auditaria o cockpit — o mesmo software que saiu. O sucessor da história dela é a CP-001, a
# campanha de homologação do Trabalho A: a bancada de `deploy/` existe para servir aquela
# campanha, e é isso que ADR-018 registra.
#
# As quatro regras que CAP-ALVO possuía (RULE-HOMOLOG-001..004) não sumiram: viraram as
# invariantes de STAGE-DEPLOY em harness/stages.yaml, uma por fiscal declarado.
#
# Sobram as cinco capacidades do ALVO — que é o que este repositório governa.
