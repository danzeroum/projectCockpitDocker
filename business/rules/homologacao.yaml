# Regras da bancada de homologação — o ambiente que a régua tem permissão de medir.
# São as invariantes que separam "ambiente de teste" de "segunda porta para o servidor real".
# Schema: harness/schemas/business-rules.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

capability: CAP-ALVO

rules:
  - id: RULE-HOMOLOG-001
    name: "Homologação não tem superfície de escrita"
    status: verified
    statement: >
      O stack de homologação fixa ENABLE_ACTIONS="0" (rotas de mutação não são registradas:
      404, não 403) e nega POST/DELETE no socket-proxy.
    rationale: >
      Duas trancas em camadas diferentes: a de dentro é da aplicação, a de fora é do daemon.
      Uma tranca que o vigiado desliga sozinho não é uma tranca.
    verified_by:
      - tests/integration/test_homologacao.py

  - id: RULE-HOMOLOG-002
    name: "Homologação não colide com produção"
    status: verified
    statement: >
      Nomes de container, nome de projeto e volume de dados são próprios; toda montagem de
      host é somente-leitura.
    rationale: >
      `compose up` com o nome de container de produção derruba o cockpit de verdade, e
      `down -v` com o volume compartilhado apaga 30 dias de série histórica.
    verified_by:
      - tests/integration/test_homologacao.py

  - id: RULE-HOMOLOG-003
    name: "Homologação não reusa a credencial de produção"
    status: verified
    statement: >
      O basic auth do ingress de homologação usa um .htpasswd separado; o .env real nunca é
      comitado e o .example carrega apenas placeholders.
    rationale: >
      Credenciais iguais fazem o ambiente de teste virar uma porta alternativa para o mesmo
      servidor: quem obtém a senha "de teste" entra na produção.
    verified_by:
      - tests/integration/test_homologacao.py

  - id: RULE-HOMOLOG-004
    name: "Produção nunca é publicada pelo caminho de homologação"
    status: verified
    statement: >
      O script de ingress recusa docker.danzeroum.com e só escreve blocos apontando para o
      upstream docker-cockpit-homolog:8000.
    rationale: >
      Rodá-lo com o host de produção publicaria docker.danzeroum.com servindo o stack de
      teste, com TLS válido — o pior tipo de erro, porque parece que funcionou.
    verified_by:
      - tests/integration/test_homologacao.py
