# Índice fiscalizável dos ADRs. Os arquivos .md são a prosa; este índice é o que o CI verifica:
# arquivo existe, status válido, referências (CAP/CMP/RISK/ADR) resolvem.
# Schema: harness/schemas/adr-index.schema.json
schema_version: "1.0"
metadata_version: "1.0"
source_of_truth: true
generated_from: null

adrs:
  - id: ADR-001
    title: "Consumir a WebQA Suite como padrão externo, nunca copiado"
    status: accepted
    file: architecture/adr/ADR-001-webqa-como-padrao-externo.md
    related_risks:
      - RISK-WEBQA-001

    assertions:
      - id: ADR-001-A1
        kind: path_absent
        severity: critical
        risk: RISK-WEBQA-001
        description: "A régua é DECLARADA e nunca copiada. Uma cópia local da lista curada pode ter uma linha removida, e o laudo passa a dizer 'nenhum achado' sem erro nem aviso — que é o estado que esta decisão inteira existe para impedir."
        paths:
          - webqa
          - checks
          - data/caminhos-sensiveis.yaml
      - id: ADR-001-A2
        kind: file_matches
        severity: critical
        risk: RISK-WEBQA-001
        description: "O pin é EXATO, com `==`. Faixa tornaria 'a mesma régua' indecidível, e dois laudos só se comparam se a régua for a mesma."
        files: ["requirements-qa.txt"]
        pattern: "^webqa-suite=="
  - id: ADR-002
    title: "Enforcement mora em schema, CI e gates — não em markdown"
    status: accepted
    file: architecture/adr/ADR-002-enforcement-nao-em-markdown.md
    related_risks:
      - RISK-META-001

    assertions:
      - id: ADR-002-A1
        kind: file_matches
        severity: critical
        risk: RISK-META-001
        description: "A promessa central: regra que precisa morder tem fiscal EXECUTÁVEL, e ele roda no CI. Sem este passo, todo schema desta casa vira documentação — e documentação não reprova PR."
        files: [".github/workflows/validate-metadata.yml"]
        pattern: "python ci/validate_all\\.py"
      - id: ADR-002-A2
        kind: path_present
        severity: high
        risk: RISK-META-001
        description: "A camada estrutural existe como schema, não como prosa: forma, tipos, enums e padrões são recusados pela máquina antes de qualquer leitura humana."
        paths:
          - harness/schemas/project.schema.json
          - harness/schemas/change-proposal.schema.json
  - id: ADR-003
    title: "Versão do padrão em fonte única e procedência carimbada"
    status: accepted
    file: architecture/adr/ADR-003-versao-em-fonte-unica.md
    related_risks:
      - RISK-DEP-001

    assertions:
      - id: ADR-003-A1
        kind: file_matches
        severity: critical
        risk: RISK-WEBQA-001
        description: "A versão mora em UM lugar e os demais REFERENCIAM. `project.yaml` aponta para o arquivo de pin em vez de repetir o número — restatar cria uma segunda fonte, e a primeira divergência entre as duas passa despercebida."
        files: ["project.yaml"]
        pattern: "version_source: requirements-qa\\.txt"
      - id: ADR-003-A2
        kind: file_lacks
        severity: critical
        risk: RISK-WEBQA-001
        description: "E o outro lado da mesma decisão: o NÚMERO não aparece em project.yaml. Sem esta asserção, `version_source` poderia conviver com um `version: 1.0.0` logo abaixo, e o documento estaria formalmente certo e materialmente com duas fontes."
        files: ["project.yaml"]
        pattern: "version: [0-9]"
        # Mutação DECLARADA: a derivação mecânica não constrói texto que case `[0-9]`, e uma
        # asserção bloqueante sem mutação não pode provar que morde. O texto injetado é o gesto
        # real de quem restata — a linha que alguém acrescenta "só para ficar explícito", e que
        # cria a segunda fonte de verdade sem remover a primeira.
        mutation:
          op: injetar_texto
          alvo: project.yaml
          texto: "version: 1.0.0"
  - id: ADR-004
    title: "Toda mudança proposta é declarada e validada antes de executada"
    status: accepted
    file: architecture/adr/ADR-004-mudanca-proposta-declarada.md
    related_risks:
      - RISK-CHANGE-001

    assertions:
      - id: ADR-004-A1
        kind: schema_lock
        severity: critical
        risk: RISK-CHANGE-001
        description: "Risco high/critical EXIGE aval humano, e a trava é estrutural: um if/then no schema, não uma convenção que alguém lembra. É o que impede um agente de se auto-aprovar mudança de alto risco."
        file: harness/schemas/change-proposal.schema.json
        pointer: /allOf/0/then/properties/proposal/properties/human_approval_required/const
        expected: true
      - id: ADR-004-A2
        kind: path_present
        severity: high
        risk: RISK-CHANGE-001
        description: "A mudança é declarada ANTES de executada, e as propostas são artefato versionado — não conversa. Sem o diretório, `change_mode: pull_request` seria promessa sem lugar onde morar."
        paths:
          - harness/change-proposals
  - id: ADR-015
    title: "O alvo auditado mora em danzeroum/docker; este repositório é o plano de controle"
    # Substituída por ADR-017: o CÓDIGO do cockpit segue upstream (parte que se manteve), mas o
    # stack de homologação passou a morar aqui. Fica no índice porque decisão substituída não
    # se apaga — se apagasse, o repositório perderia a memória de por que já foi diferente.
    status: superseded
    file: architecture/adr/ADR-015-alvo-fora-do-consumidor.md
    related_risks:
      - RISK-ALVO-001

  - id: ADR-016
    title: "Sem homologação declarada, a saída é uma pendência; nunca produção"
    status: accepted
    file: architecture/adr/ADR-016-pendencia-em-vez-de-alvo-inventado.md
    related_risks:
      - RISK-ALVO-001
      - RISK-SEGREDO-001

    assertions:
      - id: ADR-016-A1
        kind: file_matches
        severity: critical
        risk: RISK-HOMOLOG-001
        description: "A pendência é DECLARADA em vez de o alvo ser inventado: o host termina em `.invalid` (RFC 2606, nunca resolve), e é isso que faz a ausência de homologação ser um estado nomeado em vez de um apontamento para produção."
        files: ["tests/qa/config.yaml"]
        pattern: "\\.invalid"
      - id: ADR-016-A2
        kind: file_lacks
        severity: critical
        risk: RISK-HOMOLOG-001
        description: "E o que a decisão PROÍBE, que é a metade que importa: o `base_url` não aponta para produção. Ancorada na CONFIGURAÇÃO e não na menção — o host de produção É citado no comentário que explica por que não se aponta para ele, e um padrão que acusasse a menção acusaria o documento que declara a decisão."
        files: ["tests/qa/config.yaml"]
        pattern: "^\\s*base_url:.*docker\\.danzeroum\\.com"
        # Mutação DECLARADA: o padrão é ancorado e a derivação não constrói texto que o case. O
        # gesto injetado é o real — alguém trocando o host `.invalid` pelo de produção "só para
        # rodar a suíte uma vez", que é exatamente o acidente que a pendência declarada impede.
        mutation:
          op: injetar_texto
          alvo: tests/qa/config.yaml
          texto: "  base_url: \"https://docker.danzeroum.com\""
  - id: ADR-017
    title: "O stack de homologação mora no consumidor; o produto continua upstream"
    status: accepted
    file: architecture/adr/ADR-017-stack-de-homologacao-no-consumidor.md
    supersedes:
      - ADR-015
    related_risks:
      - RISK-ALVO-001
      - RISK-HOMOLOG-001

    assertions:
      - id: ADR-017-A1
        kind: path_present
        severity: high
        risk: RISK-HOMOLOG-001
        description: "O stack de homologação mora AQUI — é a mudança que este ADR fez sobre a ADR-015."
        paths:
          - deploy/homologacao/compose.yml
      - id: ADR-017-A2
        kind: file_matches
        severity: critical
        risk: RISK-ALVO-001
        description: "E o que NÃO mudou: o código do cockpit não é vendorizado. O compose CONSTRÓI a partir do clone que já existe no servidor (`COCKPIT_SRC`) em vez de carregar uma cópia — uma cópia versionada derivaria do original em silêncio."
        files: ["deploy/homologacao/compose.yml"]
        pattern: "COCKPIT_SRC"

  # NOTA SOBRE `related_capabilities` NESTE ÍNDICE (CP-003 fatia-4). Cinco entradas acima citavam
  # CAP-CONTRATO, CAP-PROCEDENCIA ou CAP-ALVO. As três aposentaram: as duas primeiras descreviam
  # `src/cockpit_harness/` e foram com ele para danzeroum/cockpit-harness; CAP-ALVO aposentou com
  # motivo, e o registro está na ADR-018 abaixo. As referências foram REMOVIDAS, não repontadas
  # para a capacidade mais parecida: ponteiro que resolve para o alvo errado é pior que ausência,
  # porque parece revisado. As decisões continuam valendo — o que sumiu foi o elo com uma
  # capacidade que este repositório não declara mais, e as asserções de cada uma seguem intactas.
  - id: ADR-018
    title: "A bancada de homologação é etapa governada, não isenção"
    status: accepted
    file: architecture/adr/ADR-018-bancada-como-etapa-governada.md
    related_risks:
      - RISK-HOMOLOG-001
      - RISK-ALVO-001

    assertions:
      - id: ADR-018-A1
        kind: file_matches
        severity: high
        risk: RISK-HOMOLOG-001
        description: "A etapa declara o fiscal da invariante 1 — a tranca de FORA, a do daemon, que é a que sobrevive a um erro de configuração da aplicação. Se o símbolo sair da etapa, `deploy/` volta a ser partição fechada sem quem vigie a porta; e se ele for renomeado no teste, check_stage_coverage acusa por AST. São as duas metades da mesma trava."
        files: ["harness/stages.yaml"]
        pattern: "symbol: test_socket_proxy_nega_escrita_no_daemon"
      - id: ADR-018-A2
        kind: path_absent
        severity: medium
        risk: RISK-HOMOLOG-001
        description: "A aposentadoria das RULE-HOMOLOG-001..004 é FATO e não narrativa: o arquivo de regras não existe. Recriá-lo devolveria a segunda fonte de verdade que esta decisão eliminou — as invariantes passariam a viver em dois lugares e divergiriam no primeiro PR que tocasse um só."
        paths:
          - business/rules/homologacao.yaml
      - id: ADR-018-A3
        kind: file_lacks
        severity: medium
        risk: RISK-ALVO-001
        description: "CAP-ALVO aposentou de verdade. O padrão ancora na CHAVE do YAML e não na string: o comentário que explica a aposentadoria cita 'CAP-ALVO' três vezes, e uma proibição escrita contra a MENÇÃO faria o documento que explica a regra ser o primeiro a violá-la — o erro que esta migração já cometeu quatro vezes."
        files: ["business/capabilities.yaml"]
        pattern: "^\\s*-?\\s*id:\\s*CAP-ALVO\\s*$"
        mutation:
          op: injetar_texto
          alvo: business/capabilities.yaml
          texto: "- id: CAP-ALVO\n"