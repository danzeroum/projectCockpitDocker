  # ─────────────────────────────────────────────────────────────────────────────────────────
  # O COCKPIT (CP-003 fatia-2a) — os 65 arquivos Python de `workspace/target/app/`, lidos em
  # d6ae70ea. Os cinco componentes acima descrevem `src/cockpit_harness/`, a CLI de adoção que
  # está saindo deste repositório; NÃO foram removidos aqui porque 24 regras de negócio os
  # referenciam, e removê-los produziria regra apontando para componente inexistente — uma
  # SUBIDA, que a catraca recusa com razão. Saem junto com o código, na sub-fatia da divisão.
  #
  # `status: verified` em todos, e o critério é literal: cada `tested_by` é um arquivo de
  # `workspace/target/tests/` cujo texto referencia o módulo do componente. O vínculo foi obtido
  # mecanicamente (regex do nome do módulo no corpo do teste) e conferido por amostra — não por
  # semelhança de nome.
  # ─────────────────────────────────────────────────────────────────────────────────────────
  # Único ponto por onde a app fala com o daemon: `configure(proxy_url, terminal_enabled)` guarda o
  # endereço do socket-proxy. Nenhum outro módulo monta a URL do Docker — é o que torna a superfície
  # de acesso ao daemon uma coisa só, auditável num arquivo. Ver THREAT-SOCKET-ESCRITA.
  - id: CMP-PROXY
    kind: adapter
    capability: CAP-OBSERVAR
    status: verified
    source_paths:
    - workspace/target/app/routers/_proxy.py
    depends_on: []
    exposes: []
    tested_by:
