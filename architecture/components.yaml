  # ─────────────────────────────────────────────────────────────────────────────────────────
  # O FRONTEND (CP-003 fatia-2b) — os 68 arquivos não-Python de `workspace/target/app/`.
  #
  # O GABARITO DO LAUDO BATEU, E A FORMA DELE NÃO É A QUE EU ESPERAVA. As "10 telas" não são uma
  # camada: são o `render` de dez dos DEZENOVE módulos. Conferido por import e não por nome —
  # `modulos/X.js` importa `screens/Y.js`, 1:1, e nenhuma tela ficou órfã. Por isso cada tela
  # entra como UM componente com os dois arquivos, e não como dois: o módulo é a unidade de
  # extensão do sistema, e a tela é o `render` dele.
  #
  # `status: implemented` e não `verified`. Os três testes de frontend existem e amarram, mas
  # `test_frontend_modulos.py` confere ESTRUTURA (que os módulos existem e registram), não o
  # comportamento de cada tela. Chamar isso de `verified` seria dizer que a tela foi exercitada
  # quando o que foi exercitado é o registro dela.
  # ─────────────────────────────────────────────────────────────────────────────────────────
  # A tela de atenção: o que precisa de olho agora.
  # Módulo `atencao` mais a tela `attention` — um componente e não dois, porque o módulo
  # É a unidade de extensão do sistema: o contrato do `registry` diz 'módulo novo = 1
  # arquivo novo, zero `if` no núcleo', e a tela é o `render` dele.
  # O NOME DIVERGE entre as duas camadas (`atencao` → `attention`): a de módulos está
  # em português e esta tela ficou em inglês. Registrado porque quem procurar
  # `screens/atencao.js` não vai achar.
  - id: CMP-TELA-ATENCAO
